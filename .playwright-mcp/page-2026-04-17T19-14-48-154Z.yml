            - generic [ref=e433]:
              - heading "⭐ Anúncio Premium (Mercado Livre)" [level=5] [ref=e434]
              - list [ref=e435]:
                - listitem [ref=e436]:
                  - text: •
                  - strong [ref=e437]: "Comissão:"
                  - text: 15% a 19% sobre o valor da venda (varia por categoria)
                - listitem [ref=e438]:
                  - text: •
                  - strong [ref=e439]: "Custo Fixo:"
                  - text: Hoje varia por faixa de preço.
                - listitem [ref=e440]:
                  - text: •
                  - strong [ref=e441]: "Visibilidade:"
                  - text: Máxima - destaque e prioridade nas buscas
                - listitem [ref=e442]:
                  - text: •
                  - strong [ref=e443]: "Parcelamento:"
                  - text: Até 12x sem juros para o comprador
                - listitem [ref=e444]:
                  - text: •
                  - strong [ref=e445]: "Benefício:"
                  - text: Maior conversão de vendas pela visibilidade
            - generic [ref=e446]:
              - heading "📦 Amazon" [level=5] [ref=e447]
              - list [ref=e448]:
                - listitem [ref=e449]:
                  - text: •
                  - strong [ref=e450]: "1. Comissão de Venda (Taxa de Referência):"
                  - text: A Amazon cobra uma comissão sobre o valor total da venda (preço do item + frete + embalagem para presente).
                  - list [ref=e451]:
                    - listitem [ref=e452]:
                      - strong [ref=e453]: "Porcentagem:"
                      - text: Geralmente entre 10% e 15% para a maioria das categorias.
                    - listitem [ref=e454]:
                      - strong [ref=e455]: "Comissão mínima:"
                      - text: Se o valor calculado da comissão for muito baixo, aplica-se uma comissão mínima de R$ 1,00 por item.
                - listitem [ref=e456]:
                  - text: •
                  - strong [ref=e457]: "2. Taxa Fixa por Item (Plano Individual):"
                  - text: "A taxa fixa depende do seu plano de vendedor:"
                  - list [ref=e458]:
                    - listitem [ref=e459]:
                      - strong [ref=e460]: "Plano Individual:"
                      - text: R$ 2,00 por item vendido (além da comissão de 10-15%).
                    - listitem [ref=e461]:
                      - strong [ref=e462]: "Plano Profissional:"
                      - text: Não tem taxa fixa por item (apenas a comissão de 10-15%). Em vez disso, paga-se uma mensalidade de R$ 19,00.
                - listitem [ref=e463]:
                  - text: •
                  - strong [ref=e464]: "3. Outras Taxas Possíveis:"
                  - list [ref=e465]:
                    - listitem [ref=e466]:
                      - strong [ref=e467]: "Logística (FBA/DBA):"
                      - text: Se você utilizar a logística da Amazon para enviar os produtos, haverá taxas de manuseio e frete, que variam conforme o peso e tamanho do produto.
                    - listitem [ref=e468]:
                      - strong [ref=e469]: "Parcelamento:"
                      - text: Se o vendedor oferecer parcelamento sem juros, pode haver uma taxa adicional de 1,5% sobre o valor total da venda.
            - generic [ref=e470]:
              - heading "🛍️ Shopee" [level=5] [ref=e471]
              - list [ref=e472]:
                - listitem [ref=e473]:
                  - text: •
                  - strong [ref=e474]: "Com Frete Grátis:"
                  - text: 14% comissão + 6% frete + R$ 4 fixo*
                - listitem [ref=e475]:
                  - text: •
                  - strong [ref=e476]: "Sem Frete Grátis:"
                  - text: 12% comissão + 2% transação + R$ 4 fixo*
                - listitem [ref=e477]:
                  - text: •
                  - strong [ref=e478]: "*Produtos abaixo de R$ 8:"
                  - text: Taxa fixa é 50% do valor do item (não R$ 4)
            - generic [ref=e479]:
              - paragraph [ref=e480]: "💡 Dicas Importantes:"
              - list [ref=e481]:
                - listitem [ref=e482]: "• O custo fixo varia conforme o preço: R$ 6,00 (até R$ 40), R$ 6,50 (R$ 40-60), R$ 6,75 (R$ 60-79)"
                - listitem [ref=e483]: • A margem recomendada já considera custos operacionais e embalagem
                - listitem [ref=e484]: • No Mercado Livre, o Premium tem maior custo mas gera mais vendas pela visibilidade
                - listitem [ref=e485]: • Valores atualizados conforme políticas de 2024 dos marketplaces
